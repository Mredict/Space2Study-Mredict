services:
  database:
    image: mongo:latest
    container_name: space2study-database
    networks:
      - space_net
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend
    networks:
      - space_net
    ports:
      - "8080:8080"
    depends_on:
      database:
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_PATH=${VITE_API_BASE_PATH:-http://192.168.56.20:8080}
    container_name: space2study-frontend
    networks:
      - space_net
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

networks:
  space_net:
    driver: bridge

volumes:
  mongodb_data:
