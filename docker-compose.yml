version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: space2study-database
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: space2study-backend
    ports:
      - "8080:8080"
    depends_on:
      - database
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_PATH=${VITE_API_BASE_PATH}
    container_name: space2study-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data: