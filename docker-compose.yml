networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

services:
  database:
    image: mongo:8.3.8-noble
    container_name: space2study-database
    restart: unless-stopped
    networks:
      - db_net
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE_PATH=/api/
    image: ${REGISTRY:-registry.space2study.internal:5000}/space2study-frontend:${IMAGE_TAG:-latest}
    container_name: space2study-frontend
    restart: unless-stopped
    read_only: true
    user: "101:101"
    networks:
      - frontend_net
    env_file:
      - ./frontend/.env
    tmpfs:
      - /tmp
      - /var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend-1:
    build: ./backend
    image: ${REGISTRY:-registry.space2study.internal:5000}/space2study-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # SECURITY: Hardening
    read_only: true
    user: "10001:10001"
    networks:
      - backend_net
      - db_net
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./backend/.env
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  backend-2:
    build: ./backend
    image: ${REGISTRY:-registry.space2study.internal:5000}/space2study-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    networks:
      - backend_net
      - db_net
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./backend/.env
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  backend-3:
    build: ./backend
    image: ${REGISTRY:-registry.space2study.internal:5000}/space2study-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    networks:
      - backend_net
      - db_net
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./backend/.env
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  loadbalancer:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: space2study-loadbalancer
    restart: unless-stopped
    read_only: true
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      - frontend_net
      - backend_net
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M


