networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge

volumes:
  mongodb_data:

services:
  database:
    image: mongo:latest
    container_name: space2study-database
    networks:
      - db_net
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    
  frontend:
    build: ./frontend
    image: ${REGISTRY:-192.168.56.15:5000}/space2study-frontend:${IMAGE_TAG:-latest}
    container_name: space2study-frontend
    networks:
      - frontend_net
    env_file:
      - ./frontend/.env
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${REGISTRY:-192.168.56.15:5000}/space2study-backend:${IMAGE_TAG:-latest}
    networks:
      - backend_net
      - db_net
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./backend/.env
    deploy:
      replicas: 3
    restart: unless-stopped

  loadbalancer:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: space2study-loadbalancer
    networks:
      - frontend_net
      - backend_net
    ports:
      - "80:8080"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

