apiVersion: v1
kind: Service
metadata:
  name: {{ include "space2study.fullname" . }}-frontend
  labels:
    app: frontend
    {{- include "space2study.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: frontend