apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "space2study.fullname" . }}-backend
  labels:
    app: backend
    {{- include "space2study.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: SERVER_PORT
              value: "8080"
            - name: MONGODB_URL
              value: "mongodb://$(DB_USERNAME):$(DB_PASSWORD)@mongodb:27017/space2study?authSource=admin"
            - name: CLIENT_URL
              value: "http://{{ .Values.global.domain }}"
            - name: SERVER_URL
              value: "http://{{ .Values.global.domain }}"
          envFrom:
            - secretRef:
                name: {{ include "space2study.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}