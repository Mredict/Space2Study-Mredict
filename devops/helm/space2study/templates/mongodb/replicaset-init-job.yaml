# Idempotent: checks rs.status() first and does nothing if the replica set is
# already initiated, so this is safe to run on every `helm upgrade`.
# NOTE: replica-set bootstrap ordering is one of the fiddlier parts of running
# Mongo yourself - verify with `kubectl exec mongodb-0 -- mongosh --eval "rs.status()"`
# after the first deploy and adjust the wait loop below if your nodes take
# longer to become DNS-resolvable than this assumes.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-rs-init
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rs-init
          image: mongo:7.0.14
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: mongodb-credentials, key: MONGO_INITDB_ROOT_USERNAME }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mongodb-credentials, key: MONGO_INITDB_ROOT_PASSWORD }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              HOST0="mongodb-0.mongodb-headless.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mongodb.port }}"

              # Wait for mongodb-0 to accept connections at all (no auth needed
              # yet - it's a bare, un-initiated replica set member).
              until mongosh --host "$HOST0" --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                echo "waiting for mongodb-0..."; sleep 5
              done

              ALREADY_INIT=$(mongosh --host "$HOST0" --quiet --eval "try { rs.status(); print('yes') } catch(e) { print('no') }")
              if [ "$ALREADY_INIT" = "yes" ]; then
                echo "replica set already initiated, nothing to do"
                exit 0
              fi

              mongosh --host "$HOST0" --quiet --eval '
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongodb-0.mongodb-headless.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mongodb.port }}" },
                    { _id: 1, host: "mongodb-1.mongodb-headless.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mongodb.port }}" },
                    { _id: 2, host: "mongodb-2.mongodb-headless.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mongodb.port }}" }
                  ]
                })
              '
              echo "replica set initiated"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
