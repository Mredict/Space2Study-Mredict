apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "space2study.fullname" . }}-db-policy
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    # Only allow pods with label 'app: backend' to reach MongoDB on 27017
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 27017