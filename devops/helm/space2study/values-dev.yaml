namespace: space2study-dev

image:
  registry: "456631682423.dkr.ecr.eu-central-1.amazonaws.com"

frontend:
  replicas: 1
  image:
    tag: 220-2c233dc
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

backend:
  replicas: 1
  image:
    tag: 220-2c233dc
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  env:
    SERVER_URL: "https://<NODE_PUBLIC_IP>"
    CLIENT_URL: "https://<NODE_PUBLIC_IP>"
    COOKIE_DOMAIN: "<NODE_PUBLIC_IP>"

mongodb:
  replicas: 2

externalSecrets:
  appSecretsName: space2study-app-secrets-dev

resourceQuota:
  cpu: "3"
  memory: 4Gi
