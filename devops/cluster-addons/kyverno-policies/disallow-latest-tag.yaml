apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources: { kinds: ["Pod"] }
      validate:
        message: "Images must use an explicit, non-'latest' tag (ECR is IMMUTABLE - use the build's unique tag)"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
