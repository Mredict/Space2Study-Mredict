apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory-limits
      match:
        any:
          - resources: { kinds: ["Pod"] }
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - ingress-nginx
                - cert-manager
                - external-secrets
                - kyverno
                - argocd
      validate:
        message: "Every container must set CPU and memory requests/limits (this is a shared 3-node lab, one runaway pod shouldn't starve everything else)"
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
