# helm install argocd argo/argo-cd -n argocd --create-namespace \
#   --version 10.8.1 -f cluster-addons/argocd-values.yaml


dex:
  enabled: false # no SSO needed - built-in admin login is enough for a lab

notifications:
  enabled: false # no Slack/webhook notification integrations configured

applicationSet:
  enabled: false # not using ApplicationSets/generators, just 2 static Applications

controller:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 384Mi }
  podSecurityContext:
    runAsNonRoot: true

server:
  resources:
    requests: { cpu: 30m, memory: 64Mi }
    limits: { cpu: 150m, memory: 192Mi }
  podSecurityContext:
    runAsNonRoot: true
  service:
    type: ClusterIP

repoServer:
  resources:
    requests: { cpu: 30m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true

redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 96Mi }
  podSecurityContext:
    runAsNonRoot: true

configs:
  params:
    server.insecure: true
