# helm install argocd argo/argo-cd -n argocd --create-namespace \
#   --version 10.8.1 -f cluster-addons/argocd-values.yaml
#
# Trimmed deliberately: your nodes had 416-780Mi available with JUST the
# other add-ons running (ingress-nginx, cert-manager, external-secrets,
# Kyverno) - a full ArgoCD install (Dex SSO, notifications-controller,
# applicationset-controller, HA-mode redis) would be a meaningfully heavier
# addition on top of that. This disables the pieces you don't need for two
# static Applications with plain admin-login auth, and sets small explicit
# resource requests on everything that's left.

dex:
  enabled: false # no SSO needed - built-in admin login is enough for a lab

notifications:
  enabled: false # no Slack/webhook notification integrations configured

applicationSet:
  enabled: false # not using ApplicationSets/generators, just 2 static Applications

controller:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 384Mi }
  # Kyverno's require-non-root policy (cluster-addons/kyverno-policies/)
  # applies to every namespace including this one - explicit here rather
  # than trusting the chart's own defaults to already satisfy it, since a
  # Kyverno rejection at pod-admission time is a confusing way to discover
  # ArgoCD itself won't start.
  podSecurityContext:
    runAsNonRoot: true

server:
  resources:
    requests: { cpu: 30m, memory: 64Mi }
    limits: { cpu: 150m, memory: 192Mi }
  podSecurityContext:
    runAsNonRoot: true
  # No separate LoadBalancer/Ingress for the ArgoCD UI - reach it via
  # `kubectl port-forward svc/argocd-server -n argocd 8080:443` when you
  # need it, rather than exposing another public endpoint on your 3 nodes.
  service:
    type: ClusterIP

repoServer:
  resources:
    requests: { cpu: 30m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  podSecurityContext:
    runAsNonRoot: true

redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 100m, memory: 96Mi }
  podSecurityContext:
    runAsNonRoot: true

configs:
  params:
    server.insecure: true # terminating TLS at ingress-nginx isn't wired up for ArgoCD's own UI yet - plain HTTP behind port-forward only, not exposed publicly
