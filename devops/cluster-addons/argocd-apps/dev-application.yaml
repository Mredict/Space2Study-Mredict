# EDIT repoURL and targetRevision before applying
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-space2study
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mredict/Space2Study-Mredict.git
    targetRevision: k8s
    path: devops/helm/space2study
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: space2study-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
