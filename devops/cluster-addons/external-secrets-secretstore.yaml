# The referenced Secret (aws-secrets-manager-credentials) is created ONCE by
# scripts/bootstrap-cluster-addons.sh from the eso_access_key_id /
# eso_secret_access_key Terraform outputs - it is never committed to git and
# never touches the node's own IAM role (see modules/iam for why).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secrets-manager-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-secrets-manager-credentials
            namespace: external-secrets
            key: secret-access-key
