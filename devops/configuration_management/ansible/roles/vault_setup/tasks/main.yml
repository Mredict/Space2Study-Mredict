---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp.gpg
    mode: '0644'

- name: Dearmor HashiCorp GPG key
  ansible.builtin.command: gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.gpg
  args:
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

- name: Add HashiCorp APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main"
    state: present
    filename: hashicorp
    update_cache: yes

- name: Install Vault via APT
  ansible.builtin.apt:
    name: vault
    state: present

- name: Create Vault user
  ansible.builtin.user:
    name: vault
    system: yes
    create_home: no

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vault
    group: vault
    mode: '0755'
  loop:
    - /etc/vault.d
    - /var/lib/vault/data

- name: Configure Vault (File storage for local lab)
  ansible.builtin.copy:
    dest: /etc/vault.d/vault.hcl
    content: |
      ui = true
      listener "tcp" {
        address = "0.0.0.0:8200"
        tls_disable = 1
      }
      storage "file" {
        path = "/var/lib/vault/data"
      }
    owner: vault
    group: vault
    mode: '0644'

- name: Ensure Vault service is running and enabled on boot
  ansible.builtin.service:
    name: vault
    state: started
    enabled: yes