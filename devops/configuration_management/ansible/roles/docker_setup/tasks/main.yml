- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker

- name: Install Docker Engine and Docker Compose Plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Add vagrant user to the docker group
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: yes

- name: Ensure Docker service is running and enabled on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Allow incoming traffic to Nginx on port 80
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Configure Docker to trust the local insecure registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["192.168.56.15:5000"]
      }
  notify: Restart Docker
