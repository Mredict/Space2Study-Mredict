---
- name: Install OpenJDK 21 (Required for Jenkins Agent)
  ansible.builtin.apt:
    name: openjdk-21-jre
    state: present
    update_cache: true

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Add vagrant user to the docker group
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: true

- name: Run local Docker Registry on port 5000
  community.docker.docker_container:
    name: local-registry
    image: registry:2
    state: started
    restart_policy: always
    ports:
      - "5000:5000"

- name: Configure Docker to trust the local insecure registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["192.168.56.15:5000"]
      }
    mode: '0644'
  notify: Restart Docker

- name: Flush handlers to restart Docker immediately
  ansible.builtin.meta: flush_handlers

- name: Download Node.js 18.x setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_18.x
    dest: /tmp/nodesource_setup.sh
    mode: '0755'

- name: Run Node.js 18.x setup script
  ansible.builtin.command: /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
  changed_when: false

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Snyk globally via npm
  ansible.builtin.command: npm install -g snyk
  args:
    creates: /usr/bin/snyk

- name: Install python3-pip (Required for ansible-lint)
  ansible.builtin.apt:
    name: python3-pip
    state: present

- name: Install ansible-lint via pip
  ansible.builtin.pip:
    name: ansible-lint
    state: present

- name: Install Hadolint binary
  ansible.builtin.get_url:
    url: "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64"
    dest: /usr/local/bin/hadolint
    mode: '0755'
    force: true

- name: Download and extract Gitleaks
  ansible.builtin.unarchive:
    src: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    mode: '0755'
    creates: /usr/local/bin/gitleaks
