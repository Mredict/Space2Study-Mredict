---
- name: Install OpenJDK 21 (Required for Jenkins Agent)
  ansible.builtin.apt:
    name: openjdk-21-jre
    state: present
    update_cache: yes

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
    state: present
    filename: docker

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Add vagrant user to the docker group
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: yes

- name: Run local Docker Registry on port 5000
  community.docker.docker_container:
    name: local-registry
    image: registry:2
    state: started
    restart_policy: always
    ports:
      - "5000:5000"

- name: Configure Docker to trust the local insecure registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["192.168.56.15:5000"]
      }
  notify: Restart Docker

- name: Flush handlers to restart Docker immediately
  ansible.builtin.meta: flush_handlers

- name: Download Trivy GPG key
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /etc/apt/keyrings/trivy.asc
    mode: '0644'

- name: Add Trivy APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/trivy.asc] https://aquasecurity.github.io/trivy-repo/deb {{ ansible_distribution_release }} main"
    state: present
    filename: trivy

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: present
    update_cache: yes