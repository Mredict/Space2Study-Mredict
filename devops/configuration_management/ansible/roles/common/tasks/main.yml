---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install basic tools
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
      - git
      - build-essential
      - ufw
    state: present

- name: Allow SSH access
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Enable UFW
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Ensure unzip dependency is present
  ansible.builtin.package:
    name: unzip
    state: present

- name: Download and unpack AWS CLI v2 bundle
  ansible.builtin.unarchive:
    src: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install

- name: Run AWS CLI installer
  ansible.builtin.command:
    cmd: /tmp/aws/install --update
    creates: /usr/local/bin/aws

- name: Clean up installer temporary files
  ansible.builtin.file:
    path: /tmp/aws
    state: absent