---
- name: Deploy Application Stack via CI/CD
  hosts: all
  become: true

  vars:
    jenkins_gpg_url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"
    jenkins_repo_url: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    sonarqube_version: "10.6.0-community"
    
  roles:
    - common
    - docker_setup
    - jenkins_setup
    - sonarqube_setup